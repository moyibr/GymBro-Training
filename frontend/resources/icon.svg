<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 512 512">
  <!-- GymBro app-icon source. The dumbbell keeps openGym's geometry (this is a fork), redrawn
       with the rounded ends of the wordmark banner so the mark reads as one family across the
       app icon, the PWA icon and assets/banner.svg.

       Regenerate every platform size from here: `npm run assets:generate` in frontend/.
       The mark spans ~70% of the canvas, which keeps it inside the maskable/adaptive-icon
       safe zone on Android and inside Apple's rounded-rect crop. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#161a22"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g transform="translate(256,256) scale(1.72)" fill="#a3e635">
    <rect x="-72" y="-10" width="144" height="20" rx="7"/>
    <rect x="-80" y="-36" width="20" height="72" rx="7"/>
    <rect x="-104" y="-25" width="17" height="50" rx="7"/>
    <rect x="60" y="-36" width="20" height="72" rx="7"/>
    <rect x="87" y="-25" width="17" height="50" rx="7"/>
  </g>
</svg>
