# GymBro — standalone web server: serves the static app AND proxies /api to the backend,
# so the whole app lives on ONE origin (required for WebAuthn / passkeys).

# Security headers, defined once and pulled into every block that serves a response.
#
# The include is necessary, not stylistic: nginx's add_header does NOT merge down into a nested
# block — the moment a `location` adds a header of its own, it stops inheriting the server-level
# ones entirely. Both cache blocks below set Cache-Control, so without repeating this include
# they would quietly serve the app's JS and every exercise image with no CSP at all.
#
# The CSP is tight everywhere it can be. Two deliberate exceptions:
#   style-src 'unsafe-inline' — the UI styles through React style={{…}} attributes throughout,
#     and the printable plan writes an inline <style> into an about:blank iframe that inherits
#     this policy. Removing it means rewriting the app's styling, not tightening a config.
#   cdn.jsdelivr.net — only reachable in builds pointed at the CDN for exercise media
#     (the mobile flavor and the demo). A self-hosted instance serves img/ and gif/ from itself
#     and can drop the two jsdelivr entries.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    # API → backend container
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # App shell: always revalidate so updates show up immediately
    location ~* \.(js|css|json|html)$ {
        add_header Cache-Control "no-cache, must-revalidate";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Exercise images/GIFs never change → cache hard
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|webp|avif)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_vary on;
    gzip_min_length 1024;
}
