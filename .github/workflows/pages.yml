# Publishes the project site to GitHub Pages: https://moyibr.github.io/GymBro-Training/
#
# Two things live there:
#   /            the hand-written marketing site in website/ — including privacy.html, which
#                both app stores require to be reachable at a public URL before they will
#                accept a listing.
#   /demo/       the browser-only demo of the app itself. Pages serves static files, so this
#                build has no backend: VITE_DEMO=1 boots straight into guest mode with a
#                seeded example history (see frontend/src/lib/demo.js).
#
# The exercise images/GIFs (~140 MB) are never committed here; the demo build points at the
# upstream dataset on jsDelivr instead, pinned to a commit so the CDN can cache it forever.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - 'website/**'
      - 'assets/screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  DATASET: https://cdn.jsdelivr.net/gh/hasaneyldrm/exercises-dataset@7455efae41b330c265e7cd4b78dfa848e7ce5ebd

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
        env:
          VITE_DEMO: '1'
          VITE_IMG_BASE: ${{ env.DATASET }}/images/
          VITE_GIF_BASE: ${{ env.DATASET }}/videos/

      # website/ has no build step; it just needs the assets it references at deploy time
      # (see website/README.md): the screenshots as img/, and the PWA icons.
      - name: Assemble the site
        run: |
          mkdir -p site/img site/demo
          cp website/*.html website/styles.css website/site.js site/
          cp assets/screenshots/*.png site/img/
          cp frontend/public/icon-180.png frontend/public/icon-512.png site/
          cp -r frontend/dist/* site/demo/
          test -f site/privacy.html && test -f site/demo/index.html

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
