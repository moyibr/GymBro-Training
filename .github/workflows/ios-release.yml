# Builds the iOS app on a macOS runner — the only way to produce an iOS build without a Mac.
#
# Two modes, picked automatically:
#   • No Apple secrets  → an unsigned build. Proves the Xcode project, the Pods and the web
#     bundle still compile; produces nothing installable, which is correct before there is a
#     developer account.
#   • APPLE_* secrets set → signed archive, exported .ipa, uploaded to TestFlight.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   APPLE_TEAM_ID                    10-character team id from developer.apple.com
#   APPLE_CERT_P12_BASE64            base64 of your Apple Distribution .p12
#   APPLE_CERT_P12_PASSWORD          password for that .p12
#   APPLE_PROVISIONING_PROFILE_BASE64  base64 of the App Store provisioning profile
#   APPSTORE_API_KEY_ID / _ISSUER_ID / _API_PRIVATE_KEY   App Store Connect API key (.p8 body)
name: iOS release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    env:
      HAS_SIGNING: ${{ secrets.APPLE_CERT_P12_BASE64 != '' && secrets.APPLE_TEAM_ID != '' && 'yes' || 'no' }}
      HAS_ASC_KEY: ${{ secrets.APPSTORE_API_KEY_ID != '' && 'yes' || 'no' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
        working-directory: frontend

      - run: npm run build:mobile
        working-directory: frontend

      - name: pod install
        working-directory: frontend/ios/App
        run: pod install --repo-update

      # ---------------------------------------------------------------- unsigned check
      - name: Build (unsigned)
        if: env.HAS_SIGNING == 'no'
        working-directory: frontend/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
          echo "Unsigned build succeeded. Add the APPLE_* secrets to produce an .ipa."

      # ------------------------------------------------------------------ signed build
      - name: Import signing assets
        if: env.HAS_SIGNING == 'yes'
        env:
          CERT: ${{ secrets.APPLE_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_P12_PASSWORD }}
          PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # A throwaway keychain, unlocked for this job only — never the runner's login one.
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$CERT" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychain -d user -s "$KEYCHAIN" login.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/gymbro.mobileprovision
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive and export
        if: env.HAS_SIGNING == 'yes'
        working-directory: frontend/ios/App
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          /usr/libexec/PlistBuddy -c "Set :teamID $TEAM_ID" ExportOptions.plist
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GymBro.xcarchive" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            archive
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/GymBro.xcarchive" \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath "$RUNNER_TEMP/export"

      - uses: actions/upload-artifact@v4
        if: env.HAS_SIGNING == 'yes'
        with:
          name: gymbro-ios
          if-no-files-found: error
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to TestFlight
        if: env.HAS_SIGNING == 'yes' && env.HAS_ASC_KEY == 'yes' && startsWith(github.ref, 'refs/tags/v')
        env:
          KEY_ID: ${{ secrets.APPSTORE_API_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
          PRIVATE_KEY: ${{ secrets.APPSTORE_API_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_$KEY_ID.p8
          xcrun altool --upload-app -f "$RUNNER_TEMP"/export/*.ipa -t ios \
            --apiKey "$KEY_ID" --apiIssuer "$ISSUER_ID"
          rm -rf ~/.appstoreconnect/private_keys

      - name: Clean up keychain
        if: always() && env.HAS_SIGNING == 'yes'
        run: security delete-keychain "$RUNNER_TEMP/build.keychain" || true
